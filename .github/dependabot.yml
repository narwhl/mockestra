version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Every go.mod change triggers the full CI package matrix
    # (test.yml treats root go.mod/go.sum as "test everything"),
    # so fewer, bigger PRs directly reduce full-matrix runs.
    open-pull-requests-limit: 3
    groups:
      # The otel stable (1.x) and experimental (0.x) modules move in lockstep;
      # bumping them together keeps coupled deps like otelslog and otlploghttp
      # compatible with the otel/log API they are built against.
      opentelemetry:
        patterns:
          - go.opentelemetry.io*
      # Everything else in one PR. A dep matching multiple groups joins the
      # first listed, so this only catches non-otel modules.
      go-dependencies:
        patterns:
          - "*"
  # yml-only changes do not match test.yml's path filter, so these
  # updates run no CI jobs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
